name: Collect laps

on:
  schedule:
    # Ten minutes, off the top of the hour. GitHub drops a lot of :00 schedules.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-lap-archives
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Copy new laps into the archive
        env:
          LAPS063_DEPLOY_KEY: ${{ secrets.LAPS063_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          printf '%s\n' "$LAPS063_DEPLOY_KEY" > ~/.ssh/laps063
          chmod 600 ~/.ssh/laps063
          {
            echo "Host laps063.github.com"
            echo "  HostName github.com"
            echo "  User git"
            echo "  IdentityFile $HOME/.ssh/laps063"
            echo "  IdentitiesOnly yes"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

          dir=/tmp/collect-laps-063
          rm -rf "$dir"
          GIT_SSH_COMMAND="ssh -F $HOME/.ssh/config -o StrictHostKeyChecking=yes" \
            git clone "git@laps063.github.com:rrocketmann/polytrack-laps-063.git" "$dir"
          git -C "$dir" config user.name "rrocketmann"
          git -C "$dir" config user.email "martinmalyshau@gmail.com"
          (
            cd "$dir"
            export GIT_SSH_COMMAND="ssh -F $HOME/.ssh/config -o StrictHostKeyChecking=yes"
            TOPIC=pt360bad3248e4c33725e03b483f99b673448747fd VIDEO_STORE=git python3 collect.py
            git add laps inbox
            if [ -d videos ]; then
              git add videos
            fi
            if git diff --cached --quiet; then
              echo "no new laps"
              exit 0
            fi
            git commit -m "Add finished laps."
            git pull --rebase origin main
            git push origin main
          )
