name: Collect lap archives

on:
  schedule:
    # Ten minutes, off the top of the hour. GitHub drops a lot of :00 schedules.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-lap-archives
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Copy new laps into both archives
        env:
          LAPS_DEPLOY_KEY: ${{ secrets.LAPS_DEPLOY_KEY }}
          LAPS063_DEPLOY_KEY: ${{ secrets.LAPS063_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          printf '%s\n' "$LAPS_DEPLOY_KEY" > ~/.ssh/laps
          printf '%s\n' "$LAPS063_DEPLOY_KEY" > ~/.ssh/laps063
          chmod 600 ~/.ssh/laps ~/.ssh/laps063
          {
            echo "Host laps.github.com"
            echo "  HostName github.com"
            echo "  User git"
            echo "  IdentityFile $HOME/.ssh/laps"
            echo "  IdentitiesOnly yes"
            echo "Host laps063.github.com"
            echo "  HostName github.com"
            echo "  User git"
            echo "  IdentityFile $HOME/.ssh/laps063"
            echo "  IdentitiesOnly yes"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

          collect() {
            local host="$1"
            local repo="$2"
            local topic="$3"
            local dir="$4"
            rm -rf "$dir"
            GIT_SSH_COMMAND="ssh -F $HOME/.ssh/config -o StrictHostKeyChecking=yes" \
              git clone "git@${host}:${repo}.git" "$dir"
            git -C "$dir" config user.name "rrocketmann"
            git -C "$dir" config user.email "martinmalyshau@gmail.com"
            (
              cd "$dir"
              export GIT_SSH_COMMAND="ssh -F $HOME/.ssh/config -o StrictHostKeyChecking=yes"
              TOPIC="$topic" VIDEO_STORE=git python3 collect.py
              git add laps inbox
              if [ -d videos ]; then
                git add videos
              fi
              if git diff --cached --quiet; then
                echo "no new laps for $repo"
                return 0
              fi
              git commit -m "Add finished laps."
              git pull --rebase origin main
              git push origin main
            )
          }

          fail=0
          collect laps.github.com rrocketmann/polytrack-laps pt701f4fa6522b8cc882531db97f7f6523c6771ef2 /tmp/collect-laps || fail=1
          collect laps063.github.com rrocketmann/polytrack-laps-063 pt360bad3248e4c33725e03b483f99b673448747fd /tmp/collect-laps-063 || fail=1
          exit "$fail"
