<!DOCTYPE html>
<script>document.write('<script src="'+new URL('../js/panic.js',location.href).href+'"><\/script>');</script>
<meta charset="utf-8">
<title>Dino Runner Color</title>
<style>
html,body{margin:0;height:100%;background:#9fd4f2;overflow:hidden}
body{display:grid;place-items:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#bfe7f8;touch-action:none}
</style>
<canvas id="c" width="960" height="540" tabindex="0"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = 960, H = 540;
const GROUND = 430;

const names = ['dino-run-1','dino-run-2','dino-jump','cactus','cactus-flower','bird','cloud','sun','ground'];
const img = {};
let ready = false;

function loadAll() {
  return Promise.all(names.map((name) => new Promise((resolve) => {
    const el = new Image();
    el.onload = () => { img[name] = el; resolve(); };
    el.onerror = () => resolve();
    el.src = 'sprites/' + name + '.png';
  })));
}

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fit);
fit();

let t = 0, speed = 260, dist = 0, score = 0, best = 0;
let y = 0, vy = 0, onGround = true, dead = false, started = false;
let frame = 0, frameT = 0;
let obstacles = [];
let clouds = [];
let spawnIn = 1.1;
let groundX = 0;

function reset(run) {
  y = 0; vy = 0; onGround = true; dead = false;
  speed = 260; dist = 0; score = 0; t = 0;
  obstacles = [];
  spawnIn = 0.8;
  groundX = 0;
  started = !!run;
  clouds = [
    { x: 80, y: 70, s: 0.55 },
    { x: 420, y: 120, s: 0.4 },
    { x: 700, y: 50, s: 0.7 }
  ];
}

function jump() {
  if (!ready) return;
  if (!started) { started = true; return; }
  if (dead) { reset(true); return; }
  if (onGround) { vy = -900; onGround = false; }
}

addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
    e.preventDefault();
    jump();
  }
});
cv.addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });

function blit(name, x, foot, h) {
  const el = img[name];
  if (!el) return { x: 0, y: 0, w: 0, h: 0 };
  const s = h / el.height;
  const w = el.width * s;
  ctx.drawImage(el, x, foot - h, w, h);
  return { x, y: foot - h, w, h };
}

function hit(a, b) {
  const ax = a.x + a.w * 0.22, ay = a.y + a.h * 0.18;
  const aw = a.w * 0.5, ah = a.h * 0.62;
  const bx = b.x + b.w * 0.18, by = b.y + b.h * 0.12;
  const bw = b.w * 0.64, bh = b.h * 0.76;
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function spawn() {
  const roll = Math.random();
  if (roll < 0.46) obstacles.push({ kind: 'cactus', x: W + 40, h: 128 });
  else if (roll < 0.74) obstacles.push({ kind: 'cactus-flower', x: W + 40, h: 112 });
  else obstacles.push({ kind: 'bird', x: W + 40, h: 70, lift: 36 + Math.random() * 28 });
  spawnIn = 1.25 + Math.random() * 0.5 - Math.min(0.4, Math.max(0, speed - 260) / 800);
}

function drawGround() {
  const g = img.ground;
  const gh = 110;
  if (g) {
    const gw = g.width * (gh / g.height);
    let x = -((groundX % gw) + gw) % gw;
    for (; x < W; x += gw) ctx.drawImage(g, x, GROUND - 18, gw, gh);
  }
  ctx.fillStyle = '#91673d';
  ctx.fillRect(0, GROUND + 90, W, H - (GROUND + 90));
  const step = 34;
  const i0 = Math.floor(groundX / step) - 1;
  const i1 = Math.floor((groundX + W) / step) + 1;
  for (let i = i0; i <= i1; i++) {
    const n = (Math.imul(i, 1103515245) + 12345) >>> 0;
    const sx = Math.round(i * step - groundX);
    ctx.fillStyle = (n & 8) ? '#e4d0a0' : '#6d4a2e';
    ctx.fillRect(sx, GROUND + 8 + (n % 36), 2 + (n % 4), 2);
  }
}

let last = 0;
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000 || 0.016);
  last = now;
  if (ready && started && !dead) {
    t += dt;
    speed = Math.min(520, 260 + t * 8);
    dist += speed * dt;
    score = Math.floor(dist / 40);
    if (score > best) best = score;
    vy += 2000 * dt;
    y += vy * dt;
    if (y > 0) { y = 0; vy = 0; onGround = true; }
    groundX += speed * dt;
    clouds.forEach((c) => {
      c.x -= speed * 0.25 * dt;
      if (c.x < -220) c.x = W + 40 + Math.random() * 200;
    });
    obstacles.forEach((o) => { o.x -= speed * dt; });
    obstacles = obstacles.filter((o) => o.x > -180);
    spawnIn -= dt;
    if (spawnIn <= 0) spawn();
    if (onGround) {
      frameT += dt;
      if (frameT > 0.12) { frameT = 0; frame ^= 1; }
    }
  }

  ctx.fillStyle = '#bfe7f8';
  ctx.fillRect(0, 0, W, H);
  if (img.sun) blit('sun', W - 150, 150, 92);
  clouds.forEach((c) => blit('cloud', c.x, c.y + 70, 78 * c.s / 0.55));
  drawGround();

  const dinoName = onGround ? (frame ? 'dino-run-2' : 'dino-run-1') : 'dino-jump';
  const dino = blit(dinoName, 96, GROUND + y, 150);
  const boxes = [];
  obstacles.forEach((o) => {
    const foot = o.kind === 'bird' ? GROUND - o.lift : GROUND;
    boxes.push(blit(o.kind, o.x, foot, o.h));
  });
  if (started && !dead) {
    for (const b of boxes) {
      if (hit(dino, b)) { dead = true; break; }
    }
  }

  ctx.fillStyle = '#24506a';
  ctx.font = '700 28px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(String(score), 28, 46);
  ctx.font = '600 16px sans-serif';
  ctx.fillText('best ' + best, 28, 70);

  ctx.textAlign = 'center';
  if (!started) {
    ctx.font = '700 26px sans-serif';
    ctx.fillText('Space, up, or tap to run', W / 2, 210);
  } else if (dead) {
    ctx.font = '700 32px sans-serif';
    ctx.fillText('Score ' + score, W / 2, 190);
    ctx.font = '600 20px sans-serif';
    ctx.fillText('Space or tap to run again', W / 2, 226);
  }
  requestAnimationFrame(loop);
}

loadAll().then(() => { ready = true; reset(false); cv.focus(); });
requestAnimationFrame(loop);
</script>
