<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geography Guesser</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1220; color: #e8eef7; font-family: system-ui, Segoe UI, sans-serif; }
  button { font: inherit; }
  #app { height: 100%; display: flex; flex-direction: column; }
  header, footer { flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: #10192b; z-index: 3; }
  header { height: 48px; }
  footer { min-height: 58px; }
  .brand { font-weight: 800; }
  #status { color: #9fb0c9; }
  #total { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 700; }
  #stage { flex: 1; min-height: 0; position: relative; background: #111; }
  #pano { position: absolute; inset: 0; }
  #look-hint, #loading {
    position: absolute; z-index: 2; background: rgba(0,0,0,.55); color: #fff;
    padding: 6px 10px; border-radius: 6px; font-size: 14px; pointer-events: none;
  }
  #look-hint { left: 12px; top: 12px; }
  #loading { left: 50%; top: 46%; transform: translate(-50%, -50%); }
  #map-wrap {
    position: absolute; right: 12px; bottom: 12px; width: min(440px, 48%); height: min(300px, 52%);
    border-radius: 10px; overflow: hidden; box-shadow: 0 10px 28px rgba(0,0,0,.5); z-index: 2; background: #d5dde6;
  }
  #map-wrap.big { left: 12px; top: 12px; width: auto; height: auto; }
  #guessmap { width: 100%; height: 100%; }
  #map-tools { position: absolute; top: 8px; right: 8px; z-index: 3; }
  #map-tools button {
    width: 36px; height: 36px; padding: 0; border: 0; border-radius: 6px;
    background: #fff; color: #222; font-size: 18px; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.35);
  }
  #result { flex: 1; min-width: 0; font-size: 15px; line-height: 1.35; }
  footer > button { border: 0; border-radius: 6px; padding: 10px 16px; background: #2f6fed; color: #fff; cursor: pointer; font-weight: 700; }
  footer > button:disabled { opacity: 0.45; cursor: default; }
  #end, #setup {
    position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; padding: 28px; text-align: center; background: #0b1220;
  }
  #end h1, #setup h1 { margin: 0; font-size: 36px; }
  #setup p, #end p { max-width: 640px; margin: 0; line-height: 1.45; }
  #end ol { text-align: left; max-width: 720px; margin: 0; padding-left: 20px; }
  code { background: #1a2740; padding: 2px 6px; border-radius: 4px; }
  .hide { display: none !important; }
  @media (max-width: 800px) {
    #map-wrap { width: calc(100% - 24px); height: 40%; }
    #map-wrap.big { height: auto; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Geography Guesser</div>
    <div id="status">Round 1 of 5</div>
    <div id="total">0 pts</div>
  </header>
  <div id="stage">
    <div id="pano"></div>
    <div id="look-hint">Drag to look. Click the road to walk. Scroll to zoom.</div>
    <div id="loading" class="hide">Finding a street…</div>
    <div id="map-wrap">
      <div id="guessmap"></div>
      <div id="map-tools">
        <button id="map-grow" type="button" aria-label="Expand map">⛶</button>
      </div>
    </div>
    <div id="setup" class="hide"></div>
    <div id="end" class="hide"></div>
  </div>
  <footer>
    <div id="result">Walk around for clues, then pin the map where the round started.</div>
    <button id="guess" disabled>Guess</button>
    <button id="next" class="hide">Next</button>
    <button id="again" class="hide">Play again</button>
  </footer>
</div>
<script src="config.js"></script>
<script src="game.js"></script>
</body>
</html>
