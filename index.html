<script>
(function(){
  var base = window.location.pathname.replace(/[^/]*$/, '');
  function fixLinks() {
    document.querySelectorAll('a[href^="/"]').forEach(function(a) {
      if (a.dataset.sgFixed) return;
      var h = a.getAttribute('href');
      if (h.startsWith('//')) return;
      if (h.startsWith('/home') || h === '/') { a.href = base; a.dataset.sgFixed = '1'; return; }
      if (h === '/resources') return;
      if (h.startsWith('/')) { a.href = 'javascript:void(0)'; a.dataset.sgFixed = '1'; }
    });
  }
  fixLinks();
  var ob = new MutationObserver(fixLinks);
  ob.observe(document.body, { childList: true, subtree: true });
  setTimeout(function() { ob.disconnect(); }, 15000);
})();
</script>
<script>
(function(){
  var names = ["2048","A Palace For Fools","Basketrandom","Bitlife","Bobbysbugs","Chromedino","Clusterrush","Cookieclicker","Crossyroad","Doodlejump","Doom","Drivemad","Eaglercraft","Messages","Peggyspost","Pigeon Ascent","Pixelbrowl","Quadrilactic","Retrobowl","Retrobowlcollege","Slope","Sortthecourt","Space Dwarf","Starcatcher","Subwaysurferssingapore","Supertux Classic","Tetris","Tiny Tactics","Tinyfishing","Tombofthemask","Vex3","Vex4","Vex5","Vex6"];
  var urls = ["2048/index.html","a-palace-for-fools/index.html","basketrandom/index.html","bitlife/index.html","bobbysbugs/index.html","chromedino/index.html","clusterrush/index.html","cookieclicker/index.html","crossyroad/index.html","doodlejump/index.html","doom/index.html","drivemad/index.html","eaglercraft/index.html","messages/index.html","peggyspost/index.html","pigeon-ascent/index.html","pixelbrowl/index.html","quadrilactic/index.html","retrobowl/index.html","retrobowlcollege/index.html","slope/index.html","sortthecourt/index.html","space-dwarf/index.html","starcatcher/index.html","subwaysurferssingapore/index.html","supertux-classic/index.html","tetris/index.html","tiny-tactics/index.html","tinyfishing/index.html","tombofthemask/index.html","vex3/index.html","vex4/index.html","vex5/index.html","vex6/index.html"];

  var s = document.createElement('style');
  s.textContent = [
    '#sg-dropdown{display:none;position:fixed;z-index:999;background:#fff;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.2);min-width:200px;max-height:400px;overflow-y:auto;overscroll-behavior:contain}',
    '#sg-dropdown.show{display:block}',
    '#sg-dropdown a{display:block;padding:10px 16px;color:#333;text-decoration:none;font-size:14px;border-bottom:1px solid #eee;cursor:pointer}',
    '#sg-dropdown a:hover{background:#f5f5f5}',
    '#sg-dropdown a:last-child{border-bottom:none}',
    '#sg-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:9999;cursor:pointer;overscroll-behavior:contain}',
    '#sg-overlay.show{display:block}',
    '#sg-overlay .wrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:55vw;height:55vh;cursor:default}',
    '#sg-overlay iframe{width:100%;height:100%;border:none;background:#000;border-radius:4px}'
  ].join('');
  document.head.appendChild(s);

  var dd = document.createElement('div');
  dd.id = 'sg-dropdown';
  for (var i = 0; i < names.length; i++) {
    (function(idx) {
      var a = document.createElement('a');
      a.textContent = names[idx];
      a.onclick = function(e) {
        e.preventDefault();
        openGame(names[idx], urls[idx]);
      };
      dd.appendChild(a);
    })(i);
  }
  document.body.appendChild(dd);

  document.addEventListener('click', function(e) {
    var link = e.target.closest ? e.target.closest('a[href="/resources"]') : null;
    if (!link) { dd.classList.remove('show'); return; }
    e.preventDefault();
    e.stopPropagation();

    var rect = link.getBoundingClientRect();
    dd.style.top = (rect.bottom + window.scrollY) + 'px';
    dd.style.left = (rect.left + window.scrollX) + 'px';
    dd.classList.toggle('show');
  }, true);

  var ov = document.createElement('div');
  ov.id = 'sg-overlay';
  var wrap = document.createElement('div');
  wrap.className = 'wrap';
  var iframe = document.createElement('iframe');
  iframe.allowFullscreen = true;
  iframe.allow = 'autoplay; fullscreen; microphone; camera; display-capture';
  iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups');
  wrap.appendChild(iframe);
  ov.appendChild(wrap);
  document.body.appendChild(ov);

  function fitContent() {
    try {
      var doc = iframe.contentDocument || iframe.contentWindow.document;
      if (!doc || !doc.head) return;
      if (doc.getElementById('sg-fit')) return;
      var s = doc.createElement('style');
      s.id = 'sg-fit';
      s.textContent = 'html,body{overflow:hidden!important;margin:0!important;padding:0!important;width:100%!important;height:100%!important}canvas,#unity-canvas,#unity-container{max-width:100%!important;max-height:100%!important;width:100%!important;height:100%!important;object-fit:contain!important}';
      doc.head.appendChild(s);
      var obs = new MutationObserver(function(){
        var e = doc.getElementById('sg-fit');
        e && e.remove();
        doc.head.appendChild(s.cloneNode());
      });
      if (doc.body) obs.observe(doc.body, { childList: true, subtree: true });
      setTimeout(function(){ obs.disconnect(); }, 10000);
    } catch(e) {}
  }

  window.openGame = function(name, url) {
    iframe.src = url;
    ov.classList.add('show');
    document.body.style.overflow = 'hidden';
    iframe.addEventListener('load', fitContent, { once: true });
    gtag('event', 'play_game', { 'game_name': name, 'game_url': url });
  };
  ov.onclick = function(e) {
    if (e.target === ov || e.target === wrap) {
      ov.classList.remove('show');
      iframe.src = '';
      document.body.style.overflow = '';
    }
  };
})();
</script>
