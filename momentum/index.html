<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>MOMENTUM — a pixel art speed platformer</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #08060f;
    overflow: hidden;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #cbc4e6;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    background: #0b0a14;
  }
  /* the controls line fades out of the way once you start playing */
  #hint {
    position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%);
    font-size: 11px; letter-spacing: .12em; color: #6c62a0;
    text-transform: uppercase; pointer-events: none; user-select: none;
    text-shadow: 0 1px 0 #000, 0 0 8px #000;
    animation: fade 9s ease-in forwards;
  }
  @keyframes fade { 0%, 55% { opacity: .85 } 100% { opacity: 0 } }
</style>
</head>
<body>
  <div id="wrap"><canvas id="game"></canvas></div>
  <div id="hint">jump space/z/j &middot; dash shift/x/k &middot; ledges c/l (hold) &middot; burst v &middot; o controls &middot; f fullscreen</div>
  <script type="module" src="./src/main.js"></script>
  <script src="js/analytics.js"></script>
  <script>window.trackGameAnalytics.start('momentum');</script>
</body>
</html>
