<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenGuesser</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1220; color: #e8eef7; font-family: system-ui, Segoe UI, sans-serif; }
  button, input { font: inherit; }
  #app { height: 100%; display: flex; flex-direction: column; }
  header, footer { flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: #10192b; }
  header { height: 52px; }
  footer { min-height: 64px; }
  .brand { font-weight: 800; letter-spacing: 0.02em; }
  #status { color: #9fb0c9; }
  #total { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 700; }
  #stage { flex: 1; min-height: 0; display: flex; }
  #photo-wrap { flex: 1; min-width: 0; background: #000; display: flex; align-items: center; justify-content: center; }
  #photo { width: 100%; height: 100%; object-fit: contain; }
  #map-wrap { width: 38%; min-width: 260px; position: relative; background: #16324f; }
  #map { width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  #map-hint { position: absolute; left: 10px; bottom: 10px; background: rgba(0,0,0,.55); padding: 4px 8px; border-radius: 4px; font-size: 13px; pointer-events: none; }
  #result { flex: 1; min-width: 0; font-size: 15px; line-height: 1.35; }
  #result a { color: #8ec5ff; }
  button { border: 0; border-radius: 6px; padding: 10px 16px; background: #2f6fed; color: #fff; cursor: pointer; font-weight: 700; }
  button:disabled { opacity: 0.45; cursor: default; }
  button.ghost { background: transparent; color: #c5d4ea; }
  #end { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; }
  #end h1 { margin: 0; font-size: 42px; }
  #end ol { text-align: left; max-width: 640px; margin: 0; padding-left: 20px; }
  #credits { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: flex; align-items: center; justify-content: center; padding: 24px; }
  #credits .card { background: #141d2e; border-radius: 8px; max-width: 720px; max-height: 80%; overflow: auto; padding: 18px 20px; }
  #credits h2 { margin: 0 0 8px; }
  #credits li { margin: 8px 0; }
  .hide { display: none !important; }
  @media (max-width: 800px) {
    #stage { flex-direction: column; }
    #map-wrap { width: 100%; height: 46%; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">OpenGuesser</div>
    <div id="status">Round 1 of 5</div>
    <div id="total">0 pts</div>
  </header>
  <div id="stage">
    <div id="photo-wrap"><img id="photo" alt=""></div>
    <div id="map-wrap">
      <svg id="map" viewBox="0 0 1000 520" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="map-hint">Click where this photo was taken</div>
    </div>
  </div>
  <div id="end" class="hide"></div>
  <footer>
    <div id="result">Look around the photo, then drop a pin.</div>
    <button id="guess" disabled>Guess</button>
    <button id="next" class="hide">Next</button>
    <button id="again" class="hide">Play again</button>
    <button id="credit-btn" class="ghost">Credits</button>
  </footer>
</div>
<div id="credits" class="hide">
  <div class="card">
    <h2>Credits</h2>
    <p>Every photo is stored on this site. Nothing is loaded from Google, Street View, or anywhere else. Map shapes are Natural Earth, which is public domain.</p>
    <ol id="credit-list"></ol>
    <button id="credit-close">Close</button>
  </div>
</div>
<script src="world.js"></script>
<script src="places.js"></script>
<script src="game.js"></script>
</body>
</html>
